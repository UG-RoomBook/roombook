# Monitoring on the Production host (Level 2): Prometheus, Alertmanager and
# Grafana, deployed by .github/workflows/monitoring.yml as project
# roombook-monitoring. Every port is bound to localhost; reach Grafana with the
# Session Manager tunnel from `terraform output grafana_tunnel`.
#
# Prometheus scrapes node-exporter and cAdvisor on all three hosts over the
# private network, and the Production app's /metrics over its backend network.

services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitoring, app]
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /etc/roombook/alertmanager-discord-url:/etc/alertmanager/discord-url:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring]
    mem_limit: 128m

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    env_file: [/etc/roombook/monitoring.env]
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [monitoring]
    depends_on: [prometheus]
    mem_limit: 256m

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  monitoring: {}
  # The Production app's internal network, created by the roombook-production project.
  app:
    name: roombook-production_backend
    external: true
