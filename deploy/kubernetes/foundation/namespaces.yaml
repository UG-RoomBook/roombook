apiVersion: v1
kind: Namespace
metadata:
  name: roombook-prod
  labels:
    app.kubernetes.io/part-of: roombook
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: v1
kind: Namespace
metadata:
  name: roombook-staging
  labels:
    app.kubernetes.io/part-of: roombook
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: v1
kind: Namespace
metadata:
  name: roombook-monitoring
  labels:
    app.kubernetes.io/part-of: roombook
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
---
apiVersion: v1
kind: Namespace
metadata:
  name: roombook-edge
  labels:
    app.kubernetes.io/part-of: roombook
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.37
