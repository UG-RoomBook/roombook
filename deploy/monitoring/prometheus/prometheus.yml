# Prometheus on the Production host. Private addresses are fixed by
# infra/terraform/network.tf (ci .10, test .20, production .30).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: roombook

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["10.40.1.10:9100"]
        labels: { host: ci }
      - targets: ["10.40.1.20:9100"]
        labels: { host: test }
      - targets: ["10.40.1.30:9100"]
        labels: { host: production }

  - job_name: cadvisor
    static_configs:
      - targets: ["10.40.1.10:8080"]
        labels: { host: ci }
      - targets: ["10.40.1.20:8080"]
        labels: { host: test }
      - targets: ["10.40.1.30:8080"]
        labels: { host: production }
    metric_relabel_configs:
      # Keep the series the dashboards use; cAdvisor exposes many more.
      - source_labels: [__name__]
        regex: "container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total|last_seen|start_time_seconds)"
        action: keep

  - job_name: roombook-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels: { host: production, environment: production }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
