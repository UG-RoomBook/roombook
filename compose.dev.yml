name: roombook-dev

services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: roombook
      POSTGRES_PASSWORD: roombook
      POSTGRES_DB: roombook
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/dev/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roombook -d roombook']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
