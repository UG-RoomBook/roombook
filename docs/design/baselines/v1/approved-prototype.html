/* Review layout: stable page grid, explicit appearance controls, room-led visuals. */
#rb-swinburne{max-width:1440px;margin-inline:auto}
#rb-swinburne .sw-shell{grid-template-columns:184px minmax(0,1fr);border-radius:12px}
#rb-swinburne .sw-sidebar{padding:28px 18px;gap:42px}
#rb-swinburne .sw-top{min-height:96px;padding:20px 100px 20px 28px}
#rb-swinburne .sw-main{padding:28px;display:flex;flex-direction:column}
#rb-swinburne .sw-stage{display:grid;flex:1;min-width:0}
#rb-swinburne .sw-stage>[data-page]{grid-area:1/1;min-width:0;min-height:655px;align-self:start}
#rb-swinburne .sw-stage>[data-page][hidden]{display:block!important;visibility:hidden;pointer-events:none}
#rb-swinburne .sw-page-title{margin-bottom:25px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#rb-swinburne .sw-page-title h1{font-size:38px;letter-spacing:-1.7px;line-height:1.2;margin:0 0 6px}
#rb-swinburne .sw-page-title p{font-size:12px;color:var(--sub)}
#rb-swinburne .sw-preview{font-size:10px;color:var(--sub);border:1px solid var(--line);padding:4px 8px;border-radius:5px}
#rb-swinburne .sw-appearance{position:relative;display:flex;padding:3px;background:var(--soft);border:1px solid var(--line);border-radius:8px;isolation:isolate;flex-shrink:0}
#rb-swinburne .sw-appearance:before{content:'';position:absolute;inset:3px auto 3px 3px;width:calc((100% - 6px)/3);background:var(--surface);border-radius:5px;box-shadow:0 1px 4px var(--shadow);transform:translateX(var(--theme-index,200%));transition:transform .32s cubic-bezier(.2,.8,.2,1),background-color .32s;z-index:-1}
#rb-swinburne .sw-appearance button{width:66px;min-height:38px;border:0;background:transparent;color:var(--sub);padding:7px 9px;font-size:11px;border-radius:5px;display:flex;justify-content:center;align-items:center;gap:5px}
#rb-swinburne .sw-appearance button[aria-pressed="true"]{color:var(--ink);font-weight:600}
#rb-swinburne .sw-appearance svg{width:13px;height:13px}
#rb-swinburne .sw-search{box-shadow:0 4px 12px var(--shadow);grid-template-columns:1.25fr 1fr 1fr 1fr;gap:14px;padding:18px}
#rb-swinburne .sw-search .sw-btn{grid-column:1/-1;justify-self:end;min-width:132px}
#rb-swinburne .sw-search input,#rb-swinburne .sw-search select{font-weight:400;font-size:14px;min-height:42px}
#rb-swinburne .sw-results-top h2{font-size:20px;letter-spacing:-.5px}
#rb-swinburne .sw-count{display:inline-block;font-size:11px}
#rb-swinburne .sw-visual{height:190px;background:light-dark(#e9e3da,#302e2b)}
#rb-swinburne .sw-scene{width:300px;height:190px;left:50%;margin-left:-150px;inset-block-start:7px}
#rb-swinburne .sw-wall{height:142px;top:8px;background:light-dark(#f3eee7,#45413b);border-bottom:9px solid light-dark(#cac0af,#2c2823)}
#rb-swinburne .sw-wall:after{content:'';position:absolute;width:85px;height:65px;left:26px;bottom:0;background:linear-gradient(125deg,light-dark(#fffbdfaa,#d6c69e12),transparent);transform:skewX(-30deg);pointer-events:none}
#rb-swinburne .sw-window{height:85px;background:linear-gradient(145deg,light-dark(#bccfd4,#344a57),light-dark(#edf1df,#6d8075))}
#rb-swinburne .sw-desk{top:105px;width:128px;height:47px;box-shadow:0 5px 0 light-dark(#785137,#5d3e2b),0 27px 14px #0003}

  <path d="M0-51Q-34-45-30-77Q-4-77 0-51M0-28Q-31-18-34-49Q-10-57 0-28M0-68Q-18-80-10-107Q12-99 0-68" fill="var(--leaf-dark)"/>
  <path d="M0-42Q35-38 34-70Q8-72 0-42M0-66Q27-65 24-94Q2-91 0-66M0-15Q28-12 29-39Q9-46 0-15" fill="var(--leaf)"/>
  <path d="M4-46L27-64M4-70L19-87M4-20L23-33" stroke="var(--paper)" stroke-width="1" opacity=".2"/>
 </g>
 </svg></div>`;
}
function renderRooms(){const filtered=rooms.filter(r=>r.capacity>=state.capacity),available=filtered.filter(r=>!busy(r.id)).length;q('.sw-count').textContent=`${available} of ${filtered.length} available`;q('[data-range]').textContent=`${dateText(state.date)} · ${state.start}–${state.end}`;q('.sw-rooms').innerHTML=filtered.map(r=>{const unavailable=busy(r.id);return `<article class="sw-room">${illustration(r)}<div class="sw-room-info"><div class="sw-room-heading"><h3>${r.name}</h3><span class="sw-status ${unavailable?'busy':''}">${unavailable?'Booked':'Available'}</span></div><p class="sw-small">${r.location}</p><div class="sw-facts"><span><i data-lucide="users" aria-hidden="true"></i>${r.capacity} people</span><span><i data-lucide="door-open" aria-hidden="true"></i>${r.kind}</span></div><div class="sw-room-bottom"><div><small>SELECTED TIME</small><strong>${state.start}–${state.end}</strong></div><button type="button" class="sw-btn ${unavailable?'':'sw-primary'} cursor-interaction" data-room="${r.id}" ${unavailable?'disabled':''}>${unavailable?'Unavailable':'Book room'}<i data-lucide="arrow-up-right" aria-hidden="true"></i></button></div></div></article>`;}).join('')||'<div class="sw-empty"><h3>No matching rooms</h3><p class="sw-small">Change the time or group size to search again.</p></div>';icons();}
function renderBookings(){q('.sw-booking-list').innerHTML=entries().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(b=>{const r=rooms.find(r=>r.id===b.room),cancelled=state.cancelled.includes(b.id);return `<article class="sw-booking"><div><h3>${r.name}</h3><p class="sw-small">${dateText(b.date)} · ${escape(b.start)}–${escape(b.end)}</p></div><div class="sw-actions"><span class="sw-status ${cancelled?'busy':''}">${cancelled?'Cancelled':'Confirmed'}</span>${cancelled?'':`<button type="button" class="sw-btn cursor-interaction" data-cancel="${escape(b.id)}">Cancel booking</button>`}</div></article>`;}).join('');}
function page(value){state.page=value;root.querySelectorAll('[data-page]').forEach(e=>{e.hidden=e.dataset.page!==value;e.inert=e.hidden;});root.querySelectorAll('[data-nav]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.nav===(value==='review'?'find':value))));if(value==='bookings')renderBookings();}
function search(){if(!form.reportValidity())return;const data=new FormData(form);if(data.get('end')<=data.get('start')){q('.sw-error').hidden=false;q('.sw-error').textContent='Choose an end time after the start time.';return;}q('.sw-error').hidden=true;state.date=data.get('date');state.start=data.get('start');state.end=data.get('end');state.capacity=Number(data.get('people'));state.selected=null;review.hidden=true;notify('');renderRooms();}
function showReview(focus=false){const r=rooms.find(r=>r.id===state.selected);if(!r)return;review.innerHTML=`<div class="sw-page-title"><div><h1>Review booking</h1><p>Check the room and time before confirming.</p></div><span class="sw-preview">Preview</span></div><div class="sw-review-layout">${illustration(r)}<div><h2>${r.name}</h2><p class="sw-small">${r.location}</p><dl class="sw-summary"><div><dt>Date</dt><dd>${dateText(state.date)}</dd></div><div><dt>Time</dt><dd>${state.start}–${state.end}</dd></div><div><dt>Capacity</dt><dd>${r.capacity} people</dd></div><div><dt>Time zone</dt><dd>Melbourne</dd></div></dl><div class="sw-actions"><button type="button" class="sw-btn cursor-interaction" data-back>Back</button><button type="button" class="sw-btn sw-primary cursor-interaction" data-confirm>Confirm booking<i data-lucide="arrow-right" aria-hidden="true"></i></button></div></div></div>`;page('review');icons();if(focus)review.querySelector('[data-confirm]').focus();}
function renderState(){form.elements.date.value=state.date;form.elements.start.value=state.start;form.elements.end.value=state.end;form.elements.people.value=String(state.capacity);setTheme();renderRooms();renderBookings();if(state.page==='review')showReview();else page(state.page);notify(state.notice||'');}
root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
 if(button.classList.contains('sw-btn')){const bounds=button.getBoundingClientRect();const ripple=document.createElement('span');ripple.className='sw-ripple';ripple.setAttribute('aria-hidden','true');ripple.style.left=(event.detail?event.clientX-bounds.left:bounds.width/2)+'px';ripple.style.top=(event.detail?event.clientY-bounds.top:bounds.height/2)+'px';button.appendChild(ripple);setTimeout(()=>ripple.remove(),600);}
 if(button.hasAttribute('data-theme')){state.theme=button.dataset.theme;setTheme();save();return;}
 if(button.dataset.nav){page(button.dataset.nav);notify('');save();return;}
 if(button.hasAttribute('data-search')){event.preventDefault();search();return;}
 if(button.dataset.room){state.selected=button.dataset.room;showReview(true);save();return;}
 if(button.hasAttribute('data-back')){const previous=state.selected;state.selected=null;page('find');q(`[data-room="${previous}"]`)?.focus();save();return;}
 if(button.hasAttribute('data-confirm')){if(!state.selected)return;if(busy(state.selected)){notify('This room is no longer available. Choose another time.');state.selected=null;renderRooms();page('find');return;}const r=rooms.find(r=>r.id===state.selected);state.added.push({id:'demo-'+Date.now(),room:state.selected,date:state.date,start:state.start,end:state.end});notify(`Booking confirmed: ${r.name}, ${dateText(state.date)}, ${state.start}–${state.end}.`);state.selected=null;renderRooms();page('bookings');q('[data-nav="bookings"]').focus();save();return;}
 if(button.dataset.cancel){const row=button.closest('.sw-booking');if(row.querySelector('.sw-confirm-cancel'))return;const check=document.createElement('div');check.className='sw-confirm-cancel';check.innerHTML=`<p class="sw-small">Cancel this reservation and release the room?</p><div class="sw-actions"><button type="button" class="sw-btn cursor-interaction" data-keep>Keep booking</button><button type="button" class="sw-btn cursor-interaction" data-release="${escape(button.dataset.cancel)}">Yes, cancel</button></div>`;row.appendChild(check);check.querySelector('[data-keep]').focus();return;}
 if(button.hasAttribute('data-keep')){const row=button.closest('.sw-booking');button.closest('.sw-confirm-cancel').remove();row.querySelector('[data-cancel]').focus();return;}
 if(button.dataset.release){state.cancelled.push(button.dataset.release);renderBookings();renderRooms();notify('Booking cancelled. The space is available again.');q('[data-nav="bookings"]').focus();save();}
});
form.addEventListener('submit',event=>{event.preventDefault();search();});
q('[data-search]').innerHTML='Find rooms<i data-lucide="search" aria-hidden="true"></i>';
restore(window.openai?.widgetState);renderState();
window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;const next=saved?.privateContent;if(!next)return;if(JSON.stringify(next)===JSON.stringify(snapshot()))return;restore(saved);renderState();});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')setTheme();});
if(globalThis.Tweak){const settings={motion:true};const tweak=new Tweak({container:root,onChange:()=>{root.dataset.motion=settings.motion?'on':'off';}});tweak.addToggle(settings,'motion',{label:'Motion'});}
})();
</script>
</div>
