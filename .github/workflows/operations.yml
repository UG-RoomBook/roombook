name: Operations

# Scheduled and on-demand operations on the persistent hosts:
#   backup         nightly pg_dump of Production to the private S3 bucket
#   restore-drill  restores that backup on the Test server into a throwaway
#                  database and checks it (proves backups are usable)
#   monitoring     deploys Prometheus, Alertmanager and Grafana on Production
#                  whenever their configuration changes on main
#   room-hours     confirms Monday-Friday 09:00-17:00 opening hours for the
#                  reference rooms in Production (RB-51 operator process)
on:
  schedule:
    - cron: "30 16 * * *" # 03:30 Melbourne (AEDT)
  push:
    branches: [main]
    paths:
      - "deploy/monitoring/**"
      - "deploy/compose/monitoring.yml"
  workflow_dispatch:
    inputs:
      task:
        description: Operation to run
        required: true
        type: choice
        default: backup-and-drill
        options: [backup-and-drill, monitoring, room-hours]

permissions:
  contents: read

jobs:
  backup:
    name: Back up Production (Production server)
    if: github.event_name == 'schedule' || inputs.task == 'backup-and-drill'
    runs-on: production
    timeout-minutes: 15
    outputs:
      key: ${{ steps.dump.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dump and upload
        id: dump
        run: |
          key=$(deploy/scripts/backup.sh production nightly)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Backup: \`$key\`" >> "$GITHUB_STEP_SUMMARY"

  restore-drill:
    name: Restore drill (Test server)
    needs: backup
    runs-on: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore into a throwaway database and verify
        env:
          KEY: ${{ needs.backup.outputs.key }}
        run: |
          result=$(deploy/scripts/restore-drill.sh "$KEY")
          echo "$result"
          {
            echo "### Restore drill"
            echo '```json'
            echo "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  monitoring:
    name: Deploy monitoring (Production server)
    if: github.event_name == 'push' || inputs.task == 'monitoring'
    runs-on: production
    timeout-minutes: 15
    concurrency:
      group: deploy-monitoring
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start or update the monitoring stack
        id: stack
        run: |
          if ! docker network inspect roombook-production_backend >/dev/null 2>&1; then
            # A configuration push before the first release has nothing to monitor yet.
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              echo "::notice::Production is not deployed yet; run Operations > monitoring after the first release."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Deploy the application to Production first; monitoring joins its network."; exit 1
          fi
          # Run from a stable copy: the runner workspace changes with every job.
          target=/srv/roombook/monitoring
          mkdir -p "$target/compose"
          rm -rf "$target/monitoring.new"
          cp -r deploy/monitoring "$target/monitoring.new"
          rm -rf "$target/monitoring" && mv "$target/monitoring.new" "$target/monitoring"
          cp deploy/compose/monitoring.yml "$target/compose/monitoring.yml"
          # Recreate the containers: their bind mounts still point at the folder that
          # was just replaced, so a reload alone would read a deleted directory.
          # Metrics, alert state and dashboards live in named volumes and are kept.
          docker compose -p roombook-monitoring -f "$target/compose/monitoring.yml" up -d --wait --remove-orphans --force-recreate
      - name: Check every scrape target is up
        if: steps.stack.outputs.skip != 'true'
        run: |
          # Right after a (re)start Prometheus can report no targets until its first
          # discovery cycle, so wait for targets to appear and for all of them to be up.
          api=http://127.0.0.1:9090/api/v1/targets
          total=0; down=""
          for _ in $(seq 1 18); do
            # Prometheus answers 503 until it has replayed its stored data; keep waiting.
            targets=$(curl -fsS "$api" 2>/dev/null) || { targets='{"data":{"activeTargets":[]}}'; sleep 10; continue; }
            total=$(jq '.data.activeTargets | length' <<<"$targets")
            down=$(jq -r '.data.activeTargets[] | select(.health != "up") | "\(.labels.job) \(.labels.host // "") \(.health) \(.lastError)"' <<<"$targets")
            [[ "$total" -gt 0 && -z "$down" ]] && break
            sleep 10
          done
          {
            echo "$total scrape targets"; echo
            echo "| Job | Host | Health |"; echo "|---|---|---|"
            jq -r '.data.activeTargets[] | "| \(.labels.job) | \(.labels.host // "-") | \(.health) |"' <<<"$targets"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$total" -eq 0 ]]; then echo "::error::Prometheus has no scrape targets; check its configuration"; exit 1; fi
          if [[ -n "$down" ]]; then echo "::error::Targets not up:"; echo "$down"; exit 1; fi

  room-hours:
    name: Confirm room hours (Production server)
    if: inputs.task == 'room-hours'
    runs-on: production
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Confirm Monday-Friday 09:00-17:00 for the reference rooms
        run: |
          # Rejected (and nothing written) if it would leave a booking outside the hours.
          app=$(docker ps -q --filter "label=com.docker.compose.project=roombook-production" \
                             --filter "label=com.docker.compose.service=app")
          [[ -n "$app" ]] || { echo "::error::Deploy the application to Production first."; exit 1; }
          docker exec "$app" python -m scripts.set_room_hours --confirm | tee "$RUNNER_TEMP/hours.jsonl"
          {
            echo "### Room hours (Production)"; echo
            echo '```'; cat "$RUNNER_TEMP/hours.jsonl"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
